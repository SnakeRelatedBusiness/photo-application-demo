<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Distributed Photo Platform</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script type="module" src="/static/js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>Photo Feed</h1>

        <section id="auth-container" class="auth-section">
            <div id="welcome-section" class="hidden">
                <p id="welcome-message" class="fw-bold"></p>
            </div>

            <form id="login-form" class="hidden form-group">
                <h2>Sign In</h2>
                <input type="text" id="username" name="username" placeholder="Username" required>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
        </section>
    </header>

    <main>
        <section id="upload-section" class="hidden form-group">
            <h2>Upload a Photo</h2>
            <form id="upload-form">
                <input type="text" id="caption" name="caption" placeholder="Photo caption" required>
                <input type="file" id="image" name="image" accept="image/*" required>
                <button type="submit">Upload</button>
            </form>
        </section>

        <hr>

        <section aria-label="Photo Feed">
            <div id="feed-container" class="feed-grid">
                <p class="loading-state">Loading feed...</p>
            </div>
        </section>
    </main>
</body>
</html>
