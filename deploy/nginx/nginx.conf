
events {
    worker_connections  1024;
}


http {

    include       mime.types;

    client_max_body_size 50m;   # enable larger photo uploads

    # Use Docker's embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;


    log_format backend_tracker '$remote_addr - [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                'served_from_backend=$upstream_addr';

    access_log /dev/stdout backend_tracker;

    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        set $backend http://app:8000;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control  "public, max-age=2592000";
        }

        location / {
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}