<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script type="module" src="/static/js/photo.js" defer></script>
</head>

<body>
    <header>
        <section  id="nav-container", class="nav-section">
            <nav style="margin-bottom: 20px">
                <a href="/" style="text-decoration: none; color: #3b82f6; font-weight: 600;">← Back to Feed</a>
            </nav>
        </section>
        <section id="auth-container" class="auth-section">
            <form id="login-form" class="hidden form-group">
                <h2>Sign In</h2>
                <input type="text" id="username" name="username" placeholder="Username" required>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
        </section>
    </header>
    <main>
        <section aria-label="Photo Detail">
            <div id="photo-container"></div>
        </section>
    </main>
<body>
</html>
